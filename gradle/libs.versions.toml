[versions]
agp = "9.4.1"

# Libirary Version
library-version = "1.0.0"
library-groupID = "am.leon"
library-artifactID = "utilities"

# Android
android-material = "1.14.0"

# Kotlin
kotlin = "2.4.10"
kotlin-serialization-json = "1.11.0"
kotlin-coroutines = "1.11.0"
kotlin-datetime = "0.8.0"

# Compose
compose-multiplatform = "1.12.1"

# SKIE
skie = "0.10.15"

# Maven
mavenPublish = "0.37.0"

[libraries]
# Android
android-material = { group = "com.google.android.material", name = "material", version.ref = "android-material" }

# Kotlin
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization-json" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlin-datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Compose
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }

[plugins]
# Android
multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

# Kotlin
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Compose
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# SKIE
touchlab-skie = { id = "co.touchlab.skie", version.ref = "skie" }

# Maven
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
